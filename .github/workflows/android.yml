name: Build Pathachihna APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'pathachihna-source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack Android project
        run: |
          test -f pathachihna-source.zip || { echo 'Upload pathachihna-source.zip to the repository root first.'; exit 1; }
          mkdir build-src
          unzip -q pathachihna-source.zip -d build-src
          test -f build-src/settings.gradle.kts || { echo 'The ZIP must contain settings.gradle.kts at its root.'; exit 1; }
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: build-src
        run: gradle --no-daemon assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pathachihna-debug-APK
          path: build-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
